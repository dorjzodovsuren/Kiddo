name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    name: Playwright (smoke, responsive, accessibility, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  html-validate:
    name: HTML markup check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate markup
        # Now blocking. The ~40 pre-existing nesting errors (cards wrapped in a
        # hrefless <a> that made every inner link and iframe illegal) were
        # cleared when the video cards were rebuilt, so index.html and the
        # channel pages validate clean and regressions should fail the build.
        run: npm run test:html
