name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    name: Playwright (smoke, responsive, accessibility, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  html-validate:
    name: HTML markup check (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate index.html
        # Non-blocking: the template carries ~40 pre-existing invalid-nesting
        # issues (clickable cards wrapping <a> and <iframe> for a lightbox
        # trigger) that are a template design pattern, not new regressions.
        # This job reports so new markup issues are visible without blocking
        # merges on that existing debt.
        continue-on-error: true
        run: npm run test:html
